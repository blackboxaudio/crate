<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>

		<!-- Apply theme immediately to prevent flash (mirrors desktop; reads localStorage written by
		     settingsStore). No splash here — the mobile app boots into the i18n loading gate. -->
		<script>
			;(function () {
				// Theme preference
				var theme = 'light'
				try {
					var stored = localStorage.getItem('crate-theme')
					if (stored === 'light' || stored === 'dark') {
						theme = stored
					} else if (stored === 'system' || !stored) {
						theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
					}
				} catch (e) {}
				document.documentElement.setAttribute('data-theme', theme)

				// Theme colors (set before style.css loads so the first paint uses correct values)
				var s = document.documentElement.style
				// Paint the page canvas immediately: body's background only arrives with style.css, so
				// without this the splash's fade-in reveals a white page (a visible flash in dark mode).
				s.setProperty('background', 'var(--surface-0)')
				if (theme === 'light') {
					s.setProperty('--surface-0', '#ffffff')
					s.setProperty('--text-primary', '#18181b')
					s.setProperty('--text-tertiary', '#71717a')
				} else {
					s.setProperty('--surface-0', '#09090b')
					s.setProperty('--text-primary', '#fafafa')
					s.setProperty('--text-tertiary', '#71717a')
				}

				// Accent color. The shared theme CSS maps data-accent -> --brand-primary once style.css loads.
				// The splash logo no longer reads it — it's pinned to the native launch-screen teal so the
				// OS launch-image crossfade lands on a pixel-identical frame — so no inline override needed.
				var accentColors = {
					blue: '#3b82f6', indigo: '#6366f1', violet: '#8b5cf6', purple: '#a855f7',
					pink: '#ec4899', rose: '#f43f5e', orange: '#f97316', amber: '#f59e0b',
					emerald: '#10b981', teal: '#14b8a6',
				}
				var accent = 'teal'
				try {
					var storedAccent = localStorage.getItem('crate-accent')
					if (storedAccent && accentColors[storedAccent]) accent = storedAccent
				} catch (e) {}
				document.documentElement.setAttribute('data-accent', accent)

				// Font preference. Mobile defaults to the native system font (San Francisco on iOS) — no
				// web-font fetch, so the first paint is instant and correct offline. The web-served families
				// stay mapped for a synced desktop preference, but mobile no longer loads any of them (they
				// fall back to the system stack until a mobile font picker ships).
				var systemStack =
					"-apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
				var fontFamilies = {
					system: systemStack,
					inter: "'Inter', sans-serif",
					nunito: "'Nunito', sans-serif",
					'open-sans': "'Open Sans', sans-serif",
					'fira-code': "'Fira Code', monospace",
					'ibm-plex-mono': "'IBM Plex Mono', monospace",
					'source-code-pro': "'Source Code Pro', monospace",
				}
				var font = 'system'
				try {
					var storedFont = localStorage.getItem('crate-font')
					if (storedFont && fontFamilies[storedFont]) font = storedFont
				} catch (e) {}
				document.documentElement.setAttribute('data-font', font)
				document.documentElement.style.setProperty('--font-family', fontFamilies[font])
			})()
		</script>

		<!-- No web-font <link>: mobile renders in the native system font (set as the default `data-font`
		     above), so there's nothing to fetch — the shell paints instantly and works offline. -->
		<title>Crate</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- Inline splash: paints immediately (before any JS); the Svelte SplashScreen removes it once
		     the app mounts. It must be a pixel-identical copy of the native launch screen's steady frame
		     (gen/apple/LaunchScreen.storyboard): same bitmap (crate-mark.png, the LaunchLogo asset), the
		     same 99x104pt box at the exact screen center, and the same fixed teal tint (#14b8a6, the
		     storyboard's tintColor — deliberately NOT the user accent). The OS crossfades its launch
		     snapshot into this first web frame, so any mismatch shows as a ghosted double logo — and any
		     fade-in here doubles the jank, so the splash paints at full opacity and only the wordmark +
		     version (absent from the native frame) fade in via that same OS crossfade. -->
		<div id="splash" style="position:fixed;inset:0;z-index:9998;background:var(--surface-0)">
			<div style="position:absolute;left:50%;top:50%;width:99px;height:104px;transform:translate(-50%,-50%);background:#14b8a6;-webkit-mask-image:url('/crate-mark.png');-webkit-mask-size:contain;-webkit-mask-repeat:no-repeat;-webkit-mask-position:center;mask-image:url('/crate-mark.png');mask-size:contain;mask-repeat:no-repeat;mask-position:center"></div>
			<div style="position:absolute;left:0;right:0;top:calc(50% + 64px);display:flex;flex-direction:column;align-items:center;gap:12px">
				<span style="font-size:18px;line-height:28px;font-weight:700;color:var(--text-primary);font-family:var(--font-family)">Crate</span>
				<span style="font-size:12px;line-height:16px;color:var(--text-tertiary);font-family:var(--font-family)">v%sveltekit.env.PUBLIC_APP_VERSION%</span>
			</div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
